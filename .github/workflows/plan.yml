# Read-only Terraform plan preview on pull requests, as the `plan` environment's
# Reader identity — it can preview but never change infrastructure or state.
# NOTE: pin actions to full commit SHAs before treating this as production.
name: Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "infrastructure/**"
      - "config/**"
      - ".github/workflows/plan.yml"

permissions:
  id-token: write # OIDC login to Azure
  contents: read # checkout

concurrency:
  group: infra-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: plan
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }} # plan (Reader) identity for this environment
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform init
        run: >
          terraform -chdir=infrastructure init -input=false
          -backend-config="resource_group_name=rg-alz-management-swc"
          -backend-config="storage_account_name=${{ vars.STATE_STORAGE_ACCOUNT_NAME }}"
          -backend-config="container_name=tfstate"
          -backend-config="key=taks.tfstate"

      - name: Terraform fmt check
        run: terraform -chdir=infrastructure fmt -check -recursive

      - name: Terraform validate
        run: terraform -chdir=infrastructure validate -no-color

      # Read-only identity cannot take a state lock, so disable locking for the preview.
      - name: Terraform plan
        run: terraform -chdir=infrastructure plan -input=false -no-color -lock=false
