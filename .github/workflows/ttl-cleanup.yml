# Scheduled safety net: destroy the cluster once its expires_at tag has passed.
# Runs as the `cleanup` environment's cleanup identity. This is a fresh scheduled
# run, never a sleeping workflow.
# NOTE: pin actions to full commit SHAs before treating this as production.
name: TTL cleanup

on:
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: infra-apply
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: cleanup
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }} # cleanup (Contributor) identity
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform init
        run: >
          terraform -chdir=infrastructure init -input=false
          -backend-config="resource_group_name=rg-alz-management-swc"
          -backend-config="storage_account_name=${{ vars.STATE_STORAGE_ACCOUNT_NAME }}"
          -backend-config="container_name=tfstate"
          -backend-config="key=taks.tfstate"

      - name: Destroy if expired
        run: |
          set -euo pipefail
          expires=$(terraform -chdir=infrastructure output -raw expires_at 2>/dev/null || echo "")
          if [ -z "$expires" ]; then
            echo "No cluster in state; nothing to clean."
            exit 0
          fi
          now=$(date -u +%s)
          exp=$(date -u -d "$expires" +%s)
          echo "now=$(date -u -d @$now) expires_at=$expires"
          if [ "$now" -ge "$exp" ]; then
            echo "Cluster expired — destroying."
            terraform -chdir=infrastructure destroy -input=false -auto-approve -no-color
          else
            echo "Not expired yet — leaving in place."
          fi
