# On merge to main, apply the AKS Terraform as the `apply` environment's deploy identity.
# The pull request (with its plan preview) is the review gate; merge = deploy.
# NOTE: pin actions to full commit SHAs before treating this as production.
name: Apply

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/**"
      - "config/**"
  workflow_dispatch: # manual trigger for the initial deploy / re-apply

permissions:
  id-token: write
  contents: read

concurrency:
  group: infra-apply # serialize apply / destroy / cleanup against each other
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: apply
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_APPLY }} # seeded repo-level per environment by the platform
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform init
        run: >
          terraform -chdir=infrastructure init -input=false
          -backend-config="resource_group_name=rg-alz-management-swc"
          -backend-config="storage_account_name=${{ vars.STATE_STORAGE_ACCOUNT_NAME }}"
          -backend-config="container_name=tfstate"
          -backend-config="key=taks-infra.tfstate"

      - name: Terraform apply
        run: terraform -chdir=infrastructure apply -input=false -auto-approve -no-color
